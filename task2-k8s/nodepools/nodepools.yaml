# ==============================================================================
# Helios AI — Karpenter NodePools
#
# TASK: Design two NodePools for the LLM Gateway workload.
#
# Context:
#   The Helios AI LLM Gateway runs two types of workloads:
#
#   1. APP workload (llm-gateway Deployment)
#      - Stateless, horizontally scalable
#      - Tolerates brief interruptions (retry logic in place)
#      - CPU-intensive: handles prompt routing and load balancing
#      - Current usage: 2-8 pods, each requesting 2 CPU / 4Gi memory
#      - Cost optimization is a priority
#
#   2. DB workload (postgres StatefulSet, redis StatefulSet)
#      - Stateful — data loss on node termination is catastrophic
#      - Cannot be safely interrupted mid-transaction
#      - Postgres: 4 CPU / 16Gi memory
#      - Redis: 1 CPU / 2Gi memory
#      - Availability is the priority — cost is secondary
#
# Requirements:
#   - App NodePool: optimize for cost, allow spot instances
#     Use compute-optimized + general purpose instance families
#     Taint: workload=app:NoSchedule
#     Maximum: 20 nodes, 80 CPU, 160Gi memory
#
#   - DB NodePool: optimize for stability, on-demand ONLY
#     Use memory-optimized + general purpose instance families
#     Taint: workload=db:NoSchedule
#     Maximum: 4 nodes, 16 CPU, 64Gi memory
#     Consolidation: DISABLED (never evict running DB nodes)
#
# Deliverable:
#   Fill in both NodePool specs below and justify your decisions in SOLUTION.md.
#   Pay attention to: disruption policy, instance family selection,
#   capacity type, limits, and consolidation settings.
# ==============================================================================

---
# YOUR APP NODEPOOL HERE
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: helios-ai-app
spec:
  # TODO: fill in template, limits, and disruption
  template:
    metadata:
      labels:
        workload: app
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: helios-ai-app-pool
      taints:
        - key: workload
          value: app
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8", "16"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      expireAfter: 720h
  limits:
    cpu: "80"
    memory: 160Gi
    nodes: "20"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      - nodes: "20%"

---
# YOUR DB NODEPOOL HERE
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: helios-ai-db
spec:
  template:
    metadata:
      labels:
        workload: db
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: helios-ai-db-pool
      taints:
        - key: workload
          value: db
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["r", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      expireAfter: Never
  limits:
    cpu: "16"
    memory: 64Gi
    nodes: "4"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: Never
    budgets:
      - nodes: "0"
